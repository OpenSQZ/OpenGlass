<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
    --muted:#8b949e; --accent:#2f81f7; --green:#3fb950; --red:#f85149;
    --amber:#d29922;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  body{background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;}
  .wrap{display:flex;flex-direction:column;height:100vh;padding:18px;gap:14px;}

  /* 顶部：状态灯 + 主控按钮 */
  .top{display:flex;align-items:center;gap:20px;background:var(--panel);
    border:1px solid var(--border);border-radius:14px;padding:16px 20px;}
  .lights{display:flex;gap:22px;}
  .light{display:flex;align-items:center;gap:8px;font-size:14px;}
  .dot{width:14px;height:14px;border-radius:50%;background:#484f58;
    box-shadow:0 0 0 2px rgba(255,255,255,.04);transition:.2s;}
  .dot.running{background:var(--green);box-shadow:0 0 10px var(--green);}
  .dot.starting{background:var(--amber);box-shadow:0 0 10px var(--amber);
    animation:pulse 1s infinite;}
  .dot.crashed{background:var(--red);box-shadow:0 0 12px var(--red);}
  @keyframes pulse{50%{opacity:.4;}}
  .spacer{flex:1;}
  button{cursor:pointer;border:none;border-radius:10px;font-size:15px;
    font-weight:600;padding:12px 22px;color:#fff;transition:.15s;}
  button:hover{filter:brightness(1.12);} button:active{transform:translateY(1px);}
  .btn-go{background:var(--green);} .btn-stop{background:var(--red);}
  .btn-restart{background:#6e40c9;}
  .btn-minor{background:#21262d;border:1px solid var(--border);color:var(--muted);
    font-size:13px;font-weight:500;padding:10px 16px;}

  /* 中部：左 prompt / 右 第一视角 */
  .mid{flex:1;display:flex;gap:14px;min-height:0;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px;display:flex;flex-direction:column;min-height:0;}
  /* 第一视角是主角：默认右侧更宽。折叠后左侧完全隐藏、右侧占满 */
  .left{flex:0 0 380px;}
  .right{flex:1;}
  .mid.collapsed .left{display:none;}
  .left-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .collapse-btn{background:#21262d;border:1px solid var(--border);color:var(--muted);
    width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;
    padding:0;display:flex;align-items:center;justify-content:center;}
  .collapse-btn:hover{color:var(--txt);border-color:var(--accent);}
  h3{font-size:13px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:12px;}
  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .preset{background:#21262d;border:1px solid var(--border);color:var(--txt);
    font-size:13px;font-weight:500;padding:8px 14px;}
  .preset.active{background:var(--accent);border-color:var(--accent);}
  textarea{flex:1;resize:none;background:#0d1117;border:1px solid var(--border);
    border-radius:10px;color:var(--txt);padding:12px;font-size:14px;
    line-height:1.6;min-height:120px;}
  .apply{background:var(--accent);margin-top:12px;}

  /* 第一视角 */
  .fpv-head{display:flex;align-items:center;justify-content:space-between;}
  .fpv-body{flex:1;margin-top:12px;border-radius:10px;overflow:hidden;
    background:#0d1117;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);}
  .fpv-body iframe{width:100%;height:100%;border:none;}
  .fpv-off{color:var(--muted);font-size:14px;text-align:center;}
  .toggle{background:#21262d;border:1px solid var(--border);color:var(--txt);
    font-size:13px;padding:7px 14px;}
  .toggle.on{background:var(--accent);border-color:var(--accent);}

  /* 底部：观众状态条 + 运维抽屉 */
  .statusbar{background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:14px 20px;display:flex;align-items:center;gap:14px;}
  .big-status{font-size:18px;font-weight:700;}
  .drawer-toggle{margin-left:auto;background:#21262d;border:1px solid var(--border);
    color:var(--muted);font-size:12px;padding:6px 12px;font-weight:500;}
  .drawer{background:#0d1117;border:1px solid var(--border);border-radius:10px;
    margin-top:10px;height:240px;display:none;flex-direction:column;overflow:hidden;}
  .drawer.open{display:flex;}
  /* tabs 固定在顶部不随日志滚动 */
  .tabs{display:flex;gap:6px;align-items:center;padding:8px 10px;
    border-bottom:1px solid var(--border);background:#11161d;
    border-radius:10px 10px 0 0;flex-shrink:0;}
  .tab{font-size:12px;padding:5px 12px;background:#161b22;border:1px solid var(--border);
    border-radius:6px;cursor:pointer;color:var(--muted);user-select:none;}
  .tab:hover{color:var(--txt);}
  .tab.active{color:var(--txt);border-color:var(--accent);background:#1c2431;}
  .autoscroll{margin-left:auto;font-size:11px;color:var(--muted);
    display:flex;align-items:center;gap:5px;cursor:pointer;}
  /* 只有日志体滚动 */
  #logbox{flex:1;overflow-y:auto;padding:10px 12px;font-family:"Consolas",monospace;
    font-size:11px;line-height:1.55;color:#9da5b0;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部 -->
  <div class="top">
    <div class="lights" id="lights"></div>
    <div class="spacer"></div>
    <label style="font-size:13px;color:var(--muted);margin-right:-8px">链路</label>
    <select id="chainSel" onchange="onChainChange()"
      style="background:#21262d;color:var(--txt);border:1px solid var(--border);
             border-radius:8px;padding:9px 12px;font-size:14px;margin-right:6px"></select>
    <label id="devLabel" style="font-size:13px;color:var(--muted);margin-right:-8px">眼镜</label>
    <select id="deviceSel" onchange="onDeviceChange()"
      style="background:#21262d;color:var(--txt);border:1px solid var(--border);
             border-radius:8px;padding:9px 12px;font-size:14px;margin-right:6px"></select>
    <button class="btn-go" onclick="startAll()">▶ 一键启动</button>
    <button class="btn-restart" onclick="restartDemo()">⟳ 重启</button>
    <button class="btn-stop" onclick="stopDemo()">■ 停止</button>
    <span style="width:1px;height:28px;background:var(--border);margin:0 4px"></span>
    <button class="btn-minor" onclick="restartAll()" title="worker/gateway 也重启，较慢">全部重启</button>
    <button class="btn-minor" onclick="stopAll()" title="关闭全部三个进程">全部停止</button>
  </div>

  <!-- 中部 -->
  <div class="mid" id="mid">
    <div class="card left" id="leftCard">
      <div class="left-head">
        <h3 style="margin:0">场景 Prompt</h3>
        <button class="collapse-btn" onclick="toggleLeft()" title="隐藏 Prompt 面板">‹</button>
      </div>
      <div class="presets" id="presets"></div>
      <textarea id="prompt" placeholder="在此编辑 prompt……"></textarea>
      <button class="apply" onclick="applyPrompt()">用此 Prompt 重启 Demo</button>
    </div>

    <div class="card right">
      <div class="fpv-head">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="collapse-btn restore" id="restoreBtn" onclick="toggleLeft()"
            title="显示 Prompt 面板" style="display:none">›</button>
          <h3 style="margin:0">第一视角</h3>
        </div>
        <button class="toggle" id="fpvBtn" onclick="toggleFpv()">开启画面</button>
      </div>
      <div class="fpv-body" id="fpvBody">
        <div class="fpv-off">画面已关闭<br><small id="fpvUrl"></small></div>
      </div>
    </div>
  </div>

  <!-- 底部 -->
  <div>
    <div class="statusbar">
      <span class="big-status" id="bigStatus">未启动</span>
      <button class="drawer-toggle" onclick="toggleDrawer()">运维日志 ▾</button>
    </div>
    <div class="drawer" id="drawer">
      <div class="tabs" id="tabs">
        <label class="autoscroll"><input type="checkbox" id="autoscroll" checked>自动滚到底</label>
      </div>
      <div id="logbox"></div>
    </div>
  </div>

</div>

<script>
let CFG = null, curTab = "llama", fpvOn = false, selectedPreset = null, curChain = "esp32";

async function init(){
  CFG = await window.pywebview.api.get_config();
  const box = document.getElementById("presets");
  Object.keys(CFG.presets).forEach((name,i)=>{
    const b = document.createElement("button");
    b.className = "preset" + (i===0?" active":"");
    b.textContent = name;
    b.onclick = ()=>selectPreset(name,b);
    box.appendChild(b);
    if(i===0){ selectedPreset=name; document.getElementById("prompt").value=CFG.presets[name]; }
  });
  // 填充链路下拉（ESP32 / Rokid）
  const csel = document.getElementById("chainSel");
  Object.keys(CFG.chains).forEach(k=>{
    const o=document.createElement("option");
    o.value=k; o.textContent=CFG.chains[k].label; csel.appendChild(o);
  });
  curChain = CFG.default_chain; csel.value = curChain;
  // 填充眼镜下拉
  const sel = document.getElementById("deviceSel");
  (CFG.devices||[]).forEach(d=>{
    const o=document.createElement("option"); o.value=d; o.textContent=d; sel.appendChild(o);
  });
  applyChain();          // 按链路刷新灯/日志页签/FPV/眼镜下拉可见性
  fpvOn=false; toggleFpv();   // 默认开启第一视角画面
  setInterval(poll, 1000);
}

// 切链路：重画状态灯、日志页签、FPV 地址；Rokid 分支隐藏眼镜下拉
function applyChain(){
  const c = CFG.chains[curChain];
  // 状态灯
  const lights = document.getElementById("lights");
  lights.innerHTML = "";
  c.procs.forEach(n=>{
    const d=document.createElement("div"); d.className="light";
    d.innerHTML = `<span class="dot" id="dot-${n}"></span>${n}`;
    lights.appendChild(d);
  });
  // 日志页签（保留 autoscroll 勾选框）
  const tabs = document.getElementById("tabs");
  const auto = tabs.querySelector(".autoscroll");
  tabs.innerHTML = "";
  c.procs.forEach((n,i)=>{
    const t=document.createElement("div");
    t.className="tab"+(i===0?" active":""); t.dataset.t=n; t.textContent=n;
    t.onclick=()=>switchTab(n); tabs.appendChild(t);
  });
  tabs.appendChild(auto);
  curTab = c.procs[0];
  // Rokid 没有 device 概念（是 APK 连进来），隐藏眼镜下拉
  const show = c.need_device;
  document.getElementById("deviceSel").style.display = show ? "" : "none";
  document.getElementById("devLabel").style.display  = show ? "" : "none";
  // FPV 地址随链路变（ESP32=demo bridge_ui:8080；Rokid=bridge:18080 自带页）
  document.getElementById("fpvUrl").textContent = c.fpv_url;
  if(fpvOn){ fpvOn=false; toggleFpv(); }   // 重挂 iframe 到新地址
}
function onChainChange(){
  curChain = document.getElementById("chainSel").value;
  window.pywebview.api.set_chain(curChain);
  applyChain();
}
function curDevice(){ return document.getElementById("deviceSel").value; }
function onDeviceChange(){ window.pywebview.api.set_device(curDevice()); }
function selectPreset(name,el){
  document.querySelectorAll(".preset").forEach(p=>p.classList.remove("active"));
  el.classList.add("active");
  selectedPreset = name;
  document.getElementById("prompt").value = CFG.presets[name];
}
function startAll(){
  const p = document.getElementById("prompt").value.trim();
  window.pywebview.api.start_all(p, curDevice(), curChain);
}
function stopDemo(){ window.pywebview.api.stop_demo(); }   // 停止：只停 demo，无需确认（现场要快）
function restartDemo(){
  // 用当前选中的 prompt 重启 demo（不弹 prompt 编辑，就用现在这套）
  const p = document.getElementById("prompt").value.trim();
  window.pywebview.api.restart_demo(p, curDevice());
}
function stopAll(){ window.pywebview.api.stop_all(); }
function restartAll(){ window.pywebview.api.restart_all(); }
function applyPrompt(){
  const p = document.getElementById("prompt").value.trim();
  if(!p){ alert("prompt 不能为空"); return; }
  window.pywebview.api.restart_demo(p, curDevice());
}
function toggleFpv(){
  fpvOn = !fpvOn;
  const url = CFG.chains[curChain].fpv_url;   // 随链路走
  const body = document.getElementById("fpvBody");
  const btn = document.getElementById("fpvBtn");
  if(fpvOn){
    body.innerHTML = `<iframe src="${url}"></iframe>`;
    btn.textContent = "关闭画面"; btn.classList.add("on");
  } else {
    body.innerHTML = `<div class="fpv-off">画面已关闭<br><small>${url}</small></div>`;
    btn.textContent = "开启画面"; btn.classList.remove("on");
  }
}
function toggleLeft(){
  const mid = document.getElementById("mid");
  const collapsed = mid.classList.toggle("collapsed");
  document.getElementById("restoreBtn").style.display = collapsed ? "flex" : "none";
}
function toggleDrawer(){ document.getElementById("drawer").classList.toggle("open"); }
function switchTab(t){
  curTab = t;
  document.querySelectorAll(".tab").forEach(x=>
    x.classList.toggle("active", x.dataset.t===t));
  const box = document.getElementById("logbox");
  box.scrollTop = box.scrollHeight;
}

const CN = {stopped:"未启动", starting:"启动中", running:"运行中", crashed:"已崩溃"};
async function poll(){
  const s = await window.pywebview.api.poll();
  const procs = s.procs || CFG.chains[curChain].procs;   // 只看当前链路四个进程
  procs.forEach(n=>{
    const dot = document.getElementById("dot-"+n);
    if(dot) dot.className = "dot " + s.status[n];
  });
  // 观众状态条：只按当前链路的进程综合判断（另一条链的尾巴不参与）
  const st = {};
  procs.forEach(n=>{ st[n] = s.status[n]; });
  const big = document.getElementById("bigStatus");
  if(Object.values(st).some(v=>v==="crashed")){
    big.textContent = "⚠ 异常，请稍候"; big.style.color="var(--red)";
  } else if(Object.values(st).every(v=>v==="running")){
    big.textContent = "● 就绪"; big.style.color="var(--green)";
  } else if(Object.values(st).some(v=>v==="starting")){
    big.textContent = "○ 连接中…"; big.style.color="var(--amber)";
  } else {
    big.textContent = "未启动"; big.style.color="var(--muted)";
  }
  // 日志：内容更新后按需自动滚到底（看最新）
  const box = document.getElementById("logbox");
  const txt = (s.logs[curTab]||[]).join("\n");
  if(box.textContent !== txt){
    box.textContent = txt;
    if(document.getElementById("autoscroll").checked){
      box.scrollTop = box.scrollHeight;
    }
  }
}
window.addEventListener("pywebviewready", init);
</script>
</body>
</html>
